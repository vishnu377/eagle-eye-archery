<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Eye Archery | Premium Equipment & Training</title>
    
    <!-- CSS Links -->
       <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" /> <!-- AOS Animation -->
    <link rel="stylesheet" href="assets/css/ee-style.css">
</head>
<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="ee-hero-slider">
        <!-- Aap yahan Slick Slider laga sakte hain baad mein -->
        <div class="container-fluid p-0">
            <div class="hero-item position-relative text-white d-flex align-items-center justify-content-center text-center" style="height: 85vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/images/banner/hero-main.jpg') center/cover;">
                <div data-aos="fade-up">
                    <h1 class="display-1 fw-black">#ARCHERY</h1>
                    <p class="lead text-uppercase ls-2">Eagle Eye Archery Private Limited</p>
                    <a href="catalog/" class="btn btn-success btn-lg px-5 mt-3 rounded-0 fw-bold">EXPLORE CATALOG</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Brands Section (mychoicearchery ki tarah grid) -->
    <section class="py-5 bg-white">
        <div class="container text-center">
            <h2 class="mb-5 fw-bold text-uppercase ls-1">Featured <span class="text-success">Brands</span></h2>
            <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-4 align-items-center">
                <!-- Example Brand Logos -->
                <div class="col" data-aos="zoom-in"><img src="assets/images/brands/hoyt.png" class="img-fluid grayscale" alt="Hoyt"></div>
                <div class="col" data-aos="zoom-in" data-aos-delay="100"><img src="assets/images/brands/mathews.png" class="img-fluid grayscale" alt="Mathews"></div>
                <div class="col" data-aos="zoom-in" data-aos-delay="200"><img src="assets/images/brands/easton.png" class="img-fluid grayscale" alt="Easton"></div>
                <!-- Aur brands add karein... -->
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    
    <script>
        // AOS Animation Initialize
        AOS.init({ duration: 1000, once: true });

        // Component Loader Function
    


        $(function(){
   $("#header-placeholder").load("components/header.html");
   $("#footer-placeholder").load("components/footer.html");
});
    </script>
</body>
</html>
